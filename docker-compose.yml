services:
  app:
    build: .
    container_name: emc_app
    user: "1000:1000"
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./:/app
    env_file:
      - .env.local
    ports:
      - "8000:8000"
    command: sh -c "if [ -f public/index.php ]; then php -S 0.0.0.0:8000 -t public; else tail -f /dev/null; fi"
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    container_name: emc_mysql
    restart: unless-stopped
    env_file:
      - .env.local
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
