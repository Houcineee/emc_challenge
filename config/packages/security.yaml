security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler(/|$)|(_wdt|assets|build)/)
            security: false
        main:
            lazy: true
            provider: app_user_provider
            json_login:
                check_path: /api/auth/login
                username_path: email
                password_path: password
            logout:
                path: /api/auth/logout

            # Activate different ways to authenticate:
            # https://symfony.com/doc/current/security.html#the-firewall

            # https://symfony.com/doc/current/security/impersonating_user.html
            # switch_user: true

    # Note: Only the *first* matching rule is applied
    access_control:
        # Authentication endpoints and public event browsing remain accessible.
        - { path: ^/api/auth/login$, roles: PUBLIC_ACCESS }
        - { path: ^/api/events(?:/\d+)?(?:/seats)?$, roles: PUBLIC_ACCESS }
        - { path: ^/api/coupons/validate$, roles: PUBLIC_ACCESS }
        - { path: ^/api/venue/seats$, roles: PUBLIC_ACCESS }
        - { path: ^/login$, roles: PUBLIC_ACCESS }

        # Administrative and cashier areas are restricted by role.
        - { path: ^/api/admin, roles: ROLE_ADMIN }
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/api/cashier, roles: [ROLE_CASHIER, ROLE_ADMIN] }
        - { path: ^/cashier, roles: [ROLE_CASHIER, ROLE_ADMIN] }

        # Customer actions require an authenticated session.
        - { path: ^/api/events/\d+/hold(?:/\d+)?$, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/api/(?:cart|checkout|tickets), roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/checkout$, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/tickets/my$, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/tickets/\d+/download$, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/api/auth/(?:me|logout)$, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
